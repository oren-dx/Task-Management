{% extends 'master/base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-warning">

                    <h4>
                        Edit Task
                    </h4>

                </div>

                <div class="card-body">

                    <form method="POST">

                        {% csrf_token %}


                        <div class="mb-3">

                            <label class="form-label">
                                Task Title
                            </label>

                            <input type="text"
                                   name="title"
                                   class="form-control"
                                   value="{{ task.title }}"
                                   required>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Description
                            </label>

                            <textarea name="description"
                                      class="form-control"
                                      rows="5">{{ task.description }}</textarea>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Status
                            </label>

                            <select name="status"
                                    class="form-select">

                                <option value="not_started"
                                    {% if task.status == 'not_started' %}selected{% endif %}>
                                    Not Started
                                </option>

                                <option value="in_progress"
                                    {% if task.status == 'in_progress' %}selected{% endif %}>
                                    In Progress
                                </option>

                                <option value="completed"
                                    {% if task.status == 'completed' %}selected{% endif %}>
                                    Completed
                                </option>

                            </select>

                        </div>


                        <div class="mb-3">

                            <label class="form-label">
                                Deadline
                            </label>

                            <input type="date"
                                   name="deadline"
                                   class="form-control"
                                   value="{{ task.deadline|date:'Y-m-d' }}">

                        </div>


                        <button type="submit"
                                class="btn btn-warning">
                            Update Task
                        </button>

                        <a href="{% url 'task_list' %}"
                           class="btn btn-secondary">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
